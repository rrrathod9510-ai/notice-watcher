name: Notice watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # har 10 minute
  workflow_dispatch:          # "Run workflow" button se manual test

permissions:
  contents: write

concurrency:
  group: notice-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check noticeboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTICE_URL: https://bisag-n.gov.in/notice
        run: python notice_watcher.py

      - name: Save seen notices
        run: |
          git config user.name "notice-watcher"
          git config user.email "notice-watcher@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen notices" && git push)
          
